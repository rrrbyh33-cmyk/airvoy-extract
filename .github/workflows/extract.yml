name: Merge and Extract Split APK

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Merge and Extract APK
        run: |
          import zipfile
          import os
          import re

          print("🔍 Looking for split archive parts...")
          # البحث عن أجزاء الملف المرفوعة
          parts = sorted([f for f in os.listdir('.') if 'Airvoy' in f and (f.endswith('.zip') or '.z' in f)])
          print(f"📦 Found parts: {parts}")

          # دمج الأجزاء بملف زيب واحد رئيسي
          merged_zip = "combined_airvoy.zip"
          print("🔄 Merging parts together...")
          with open(merged_zip, 'wb') as outfile:
              # عادة الـ .zip يكون الأخير أو يتم دمجهم بترتيب الأجزاء
              for part in parts:
                  print(f"Adding {part}...")
                  with open(part, 'rb') as infile:
                      outfile.write(infile.read())

          print("✅ Merge complete!")

          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)

          print("📦 Extracting ZIP/APK...")
          try:
              with zipfile.ZipFile(merged_zip, 'r') as zip_ref:
                  zip_ref.extractall(extract_dir)
              print("✅ Extraction complete!")
          except Exception as e:
              print(f"⚠️ Direct zip extraction note: {e}")
              # لو كان الملف مجرد أرشيف متقطع يحتاج أداة خارجية، نبحث عن أي ملف داخلي ونستخرجه
              for root, dirs, files in os.walk(extract_dir):
                  for file in files:
                      if file.endswith('.apk'):
                          print(f"Found APK inside: {file}")

          print("🔍 Scanning for API & Login Endpoints...")
          found_urls = set()
          ignored = ["android.com", "w3.org", "google.com", "googleapis.com", "example.com", "adobe.com", "schema.org"]

          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  try:
                      file_path = os.path.join(root, file)
                      with open(file_path, "rb") as f:
                          content = f.read()
                          urls = re.findall(rb'https?://[^\s<>"]+|www\.[^\s<>"]+', content)
                          for u in urls:
                              url_str = u.decode('utf-8', errors='ignore')
                              if not any(d in url_str for d in ignored):
                                  found_urls.add(url_str)
                  except:
                      pass

          print("\n" + "="*50)
          print("🎯 TARGET API & LOGIN ENDPOINTS FOUND:")
          print("="*50)
          for u in sorted(found_urls):
              print(u)
          print("="*50)
        shell: python
