name: Full APK Deep Scanner

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Full Scanner Script
        run: |
          python3 -c '
          import os
          import zipfile

          print("[*] بدء عملية الفحص الشامل لتطبيق Airvoy...")
          zip_files = [f for f in os.listdir(".") if f.endswith(".zip")]
          if not zip_files:
              print("[-] لم يتم العثور على ملف مضغوط في المجلد الحالي.")
              exit(1)

          with zipfile.ZipFile(zip_files[0], "r") as zf:
              zf.extractall("extracted_zip")

          apk_files = []
          for root, dirs, files in os.walk("extracted_zip"):
              for file in files:
                  if file.endswith(".apk"):
                      apk_files.append(os.path.join(root, file))

          if not apk_files:
              print("[-] لم يتم العثور على ملف APK داخل الملف المضغوط.")
              exit(1)

          apk_path = apk_files[0]
          print(f"[+] تم استخراج ملف الـ APK بنجاح: {apk_path}")
          
          unpacked_dir = "unpacked_apk_sources"
          os.makedirs(unpacked_dir, exist_ok=True)
          with zipfile.ZipFile(apk_path, "r") as apk_z:
              apk_z.extractall(unpacked_dir)
          
          print("[+] جاري فحص جميع الملفات (JavaScript, Smali, JSON, XML) حرفاً حرفاً...")
          
          keywords = [
              "login", "signin", "auth", "token", "password", 
              "u5iV1", "render.com", "api", "base_url", "endpoint",
              "firebase", "identitytoolkit", "oauth"
          ]
          
          results = []
          for root, dirs, files in os.walk(unpacked_dir):
              for file in files:
                  if file.endswith((".js", ".json", ".xml", ".smali", ".properties", ".txt", ".html")):
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                              found_kw = [kw for kw in keywords if kw in content.lower()]
                              if found_kw:
                                  results.append(f"الملف: {file_path}\nالكلمات المكتشفة: {found_kw}\n" + "-"*50)
                      except Exception:
                          pass

          report_file = "scan_results.txt"
          with open(report_file, "w", encoding="utf-8") as report:
              report.write("=== تقرير الفحص الشامل والتحليل العميق لتطبيق Airvoy ===\n\n")
              if results:
                  report.write("\n".join(results))
              else:
                  report.write("لم يتم العثور على تطابقات مطابقة.\n")

          print(f"[تم الانتهاء] تم حفظ النتائج في: {report_file}")
          '

      - name: Upload Scan Results Report
        uses: actions/upload-artifact@v4
        with:
          name: airvoy-scan-results
          path: scan_results.txt
