name: Extract JS Endpoints

on:
  workflow_dispatch:

jobs:
  find-js-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Search JS Files
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          mkdir -p extracted_files
          unzip -q "$ZIP_FILE" -d extracted_files/
          
          # فك ملف الـ APK استخراجاً سريعاً لاستخراج مجلد الـ assets
          APK_FILE=$(find extracted_files/ -name "*.apk" | head -n 1)
          unzip -q "$APK_FILE" -d unpacked_apk/
          
          echo "========================================="
          echo "[+] البحث داخل ملفات الـ JavaScript والـ Assets عن الروابط والدوال:"
          echo "========================================="
          
          # البحث عن أي كلمة fetch أو axios أو render داخل ملفات الـ js
          grep -rnwiE "fetch|axios|POST|GET|render" unpacked_apk/assets/ || echo "[-] لم يتم العثور على تطابقات مباشرة بملفات الـ assets."
