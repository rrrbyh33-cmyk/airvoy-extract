name: Direct APK Extractor

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'خلي رابط التحميل المباشر هنا'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download & Extract APK
        run: |
          import urllib.request
          import zipfile
          import re
          import os

          url = "${{ github.event.inputs.apk_url }}"
          print(f"📥 Downloading from: {url}")
          
          apk_path = "app.apk"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          req = urllib.request.Request(url, headers=headers)
          
          with urllib.request.urlopen(req) as response, open(apk_path, 'wb') as out_file:
              out_file.write(response.read())
          print("✅ Download complete!")

          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)

          print("📦 Extracting APK...")
          with zipfile.ZipFile(apk_path, 'r') as zip_ref:
              zip_ref.extractall(extract_dir)

          print("🔍 Scanning for API & Login Endpoints...")
          found_urls = set()
          ignored = ["android.com", "w3.org", "google.com", "googleapis.com", "example.com", "adobe.com", "schema.org"]

          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  try:
                      with open(os.path.join(root, file), "rb") as f:
                          content = f.read()
                          urls = re.findall(rb'https?://[^\s<>"]+|www\.[^\s<>"]+', content)
                          for u in urls:
                              url_str = u.decode('utf-8', errors='ignore')
                              if not any(d in url_str for d in ignored):
                                  found_urls.add(url_str)
                  except:
                      pass

          print("\n" + "="*50)
          print("🎯 TARGET API & LOGIN ENDPOINTS FOUND:")
          print("="*50)
          for u in sorted(found_urls):
              print(u)
          print("="*50)
        shell: python
