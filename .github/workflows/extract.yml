name: Extract API Endpoints Focused
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          import zipfile, os, re

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip') and 'Airvoy' in f]
          if not zip_files: exit(1)
          
          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)
          with zipfile.ZipFile(zip_files[0], 'r') as z:
              z.extractall(extract_dir)

          found_endpoints = set()
          # نمط للبحث عن الروابط أو المسارات النصية التي تحتوي على كلمات مفتاحية للـ API
          keywords = ["api", "login", "auth", "v1", "v2", "user", "account", "token", "gateway"]

          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  if file.endswith(('.xml', '.json', '.smali', '.properties', '.txt', '.js')):
                      try:
                          file_path = os.path.join(root, file)
                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                              # البحث عن الروابط الكاملة
                              urls = re.findall(r'https?://[^\s<>"\']+', content)
                              for u in urls:
                                  u_clean = u.strip().rstrip('.,;:)]}\'"')
                                  if any(k in u_clean.lower() for k in keywords) and not 'android' in u_clean and not 'google' in u_clean:
                                      found_endpoints.add(u_clean)
                              
                              # البحث عن المسارات النسبية للـ API (مثل /api/v1/login)
                              paths = re.findall(r'["\'](/api/[^\s<>"\']+|/[a-zA-Z0-9_/.-]*(?:login|auth|v1)[^\s<>"\']*)["\']', content)
                              for p in paths:
                                  if len(p) > 4:
                                      found_endpoints.add(p)
                      except:
                          pass

          print("\n" + "="*60)
          print(f"🎯 TARGET API & LOGIN ENDPOINTS ({len(found_endpoints)} found):")
          print("="*60)
          for ep in sorted(found_endpoints):
              print(ep)
          print("="*60)
        shell: python
