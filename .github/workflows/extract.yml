name: Extract All Strings and Endpoints
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          import zipfile, os, re

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip') and 'Airvoy' in f]
          if not zip_files: exit(1)
          
          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)
          with zipfile.ZipFile(zip_files[0], 'r') as z:
              z.extractall(extract_dir)

          found_endpoints = set()

          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  try:
                      file_path = os.path.join(root, file)
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          # استخراج أي شيء يبدأ بـ http أو https بطول مقبول
                          urls = re.findall(r'https?://[^\s<>"\']+', content)
                          for u in urls:
                              u_clean = u.strip().rstrip('.,;:)]}\'"')
                              if len(u_clean) > 10 and not any(x in u_clean.lower() for x in ['android.com', 'w3.org', 'google', 'github', 'schema', 'example']):
                                  found_endpoints.add(u_clean)
                  except:
                      pass

          print("\n" + "="*60)
          print(f"🎯 ALL FOUND URLS ({len(found_endpoints)} found):")
          print("="*60)
          for ep in sorted(found_endpoints):
              print(ep)
          print("="*60)
        shell: python
