name: Search and Extract Endpoints

on:
  workflow_dispatch:

jobs:
  extract-and-find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Search for URLs/Endpoints
        run: |
          echo "[*] جاري فحص الملف المضغوط..."
          
          # فحص الملف المضغوط الموجود بالمستودع
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "[*] اسم الملف المعثور عليه: $ZIP_FILE"
          
          if [ -z "$ZIP_FILE" ]; then
            echo "[-] لم يتم العثور على أي ملف مضغوط!"
            exit 1
          fi

          # إنتاج مجلد وفك الضغط داخله
          mkdir -p extracted_files
          unzip -q "$ZIP_FILE" -d extracted_files/
          
          echo "========================================="
          echo "[+] نتائج البحث عن الروابط والـ Endpoints:"
          echo "========================================="
          
          # البحث عن أي روابط http أو https أو مسارات مريبة داخل الملفات المستخرجة
          grep -rnE "https?://[a-zA-Z0-9.-]+" extracted_files/ || echo "[-] لم يتم العثور على روابط مباشرة."
          
          echo "========================================="
          echo "[+] البحث عن كلمات مفتاحية مثل api, login, render, v1:"
          echo "========================================="
          grep -rnwiE "api|login|render|v1|auth|u5iV1" extracted_files/ || echo "[-] لم يتم العثور على الكلمات المفتاحية."
