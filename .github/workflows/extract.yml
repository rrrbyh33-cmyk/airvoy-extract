name: Search and Extract Endpoints

on:
  workflow_dispatch:

jobs:
  extract-and-find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract APK Strings and Search
        run: |
          echo "[*] جاري البحث عن ملف الـ APK..."
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          mkdir -p extracted_files
          unzip -q "$ZIP_FILE" -d extracted_files/
          
          APK_FILE=$(find extracted_files/ -name "*.apk" | head -n 1)
          echo "[*] تم العثور على ملف APK: $APK_FILE"
          
          echo "========================================="
          echo "[+] استخراج النصوص والروابط من الـ APK:"
          echo "========================================="
          
          # استخراج النصوص الصريحة والبحث عن الروابط والكلمات المفتاحية
          strings "$APK_FILE" | grep -iE "https?://|api|login|render|auth|v1|u5iV1" || echo "[-] لم يتم العثور على مطابقات."
