name: Extract Clean API URLs to Console

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Extract and Scan APK
        run: |
          import zipfile
          import os
          import re

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip') and 'Airvoy' in f]
          if not zip_files:
              print("No zip found!")
              exit(1)
              
          target_zip = zip_files[0]
          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)

          with zipfile.ZipFile(target_zip, 'r') as zip_ref:
              zip_ref.extractall(extract_dir)

          found_urls = set()
          ignored = ["android.com", "w3.org", "google.com", "googleapis.com", "example.com", "adobe.com", "schema.org", "pki.goog", "iptc.org", "github.com"]

          # بحث بسيط ونظيف عن الروابط النصية الصريحة داخل كل الملفات
          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  try:
                      file_path = os.path.join(root, file)
                      # نقرأ الملف كنص مع تجاهل البايتات التالفة لضمان عدم ظهور رموز غريبة
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          # استخراج الروابط بجميع أنواعها
                          urls = re.findall(r'https?://[^\s<>"\']+|www\.[^\s<>"\']+', content)
                          for u in urls:
                              # تنظيف الروابط من أي رموز إضافية علوية أو جانبية
                              clean_u = u.strip().rstrip('.,;:)]}\'"')
                              if len(clean_u) > 8 and not any(d in clean_u for d in ignored):
                                  found_urls.add(clean_u)
                  except:
                      pass

          print("\n" + "="*60)
          print(f"🎯 FOUND {len(found_urls)} CLEAN API/LOGIN URLS:")
          print("="*60)
          for u in sorted(found_urls):
              print(u)
          print("="*60)
        shell: python
