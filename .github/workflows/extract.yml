name: Extract Exact Login Endpoints

on:
  workflow_dispatch:

jobs:
  extract-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Grep URLs from Target JS Files
        run: |
          python3 -c '
          import os, zipfile, re

          # فك الملفات إذا لم تكن مفكوكة
          zip_files = [f for f in os.listdir(".") if f.endswith(".zip")]
          if zip_files:
              with zipfile.ZipFile(zip_files[0], "r") as zf:
                  zf.extractall("extracted_zip")

          for root, dirs, files in os.walk("extracted_zip"):
              for file in files:
                  if file.endswith(".apk"):
                      with zipfile.ZipFile(os.path.join(root, file), "r") as apk_z:
                          apk_z.extractall("unpacked_apk_sources")

          target_file = "unpacked_apk_sources/assets/ad-viewer/adViewer.366d40a1.js"
          if os.path.exists(target_file):
              print(f"=== فحص الملف الأساسي: {target_file} ===")
              with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
                  # البحث عن أي رابط أو مسار API داخل الملف
                  urls = re.findall(r"https?://[^\s\"<>]+|/[a-zA-Z0-9_/-]+(?:api|auth|login|v1)[^\s\"<>]*", content)
                  for u in sorted(set(urls)):
                      print(f"[رابط مكتشف]: {u}")
          else:
              print("[-] لم يتم العثور على الملف بالمجلد المحدد.")
          '
