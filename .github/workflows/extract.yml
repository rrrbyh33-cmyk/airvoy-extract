name: Extract and Save URLs to File

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Extract and Scan APK
        run: |
          import zipfile
          import os
          import re

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip') and 'Airvoy' in f]
          if not zip_files:
              exit(1)
              
          target_zip = zip_files[0]
          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)

          with zipfile.ZipFile(target_zip, 'r') as zip_ref:
              zip_ref.extractall(extract_dir)

          found_urls = set()
          ignored = ["android.com", "w3.org", "google.com", "googleapis.com", "example.com", "adobe.com", "schema.org"]

          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  try:
                      file_path = os.path.join(root, file)
                      with open(file_path, "rb") as f:
                          content = f.read()
                          urls = re.findall(rb'https?://[^\s<>"]+|www\.[^\s<>"]+', content)
                          for u in urls:
                              url_str = u.decode('utf-8', errors='ignore')
                              if not any(d in url_str for d in ignored):
                                  found_urls.add(url_str)
                  except:
                      pass

          # حفظ الروابط في ملف نصي
          with open("urls.txt", "w", encoding="utf-8") as out:
              for u in sorted(found_urls):
                  out.write(u + "\n")
          print("✅ Done writing URLs to urls.txt")
        shell: python

      - name: Upload URLs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airvoy-endpoints
          path: urls.txt
