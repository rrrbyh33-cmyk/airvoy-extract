name: Telegram Bot APK Extractor

on:
  workflow_dispatch:
    inputs:
      direct_apk_url:
        description: 'رابط تليجرام المباشر للملف'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download and Extract APK
        run: |
          import urllib.request
          import zipfile
          import re
          import os

          url = "${{ github.event.inputs.direct_apk_url }}"
          print(f"📥 Downloading APK from direct link...")
          
          apk_path = "app.apk"
          urllib.request.urlretrieve(url, apk_path)
          print("✅ Download complete!")

          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)

          print("📦 Extracting APK contents...")
          with zipfile.ZipFile(apk_path, 'r') as zip_ref:
              zip_ref.extractall(extract_dir)

          print("🔍 Scanning for API and Login endpoints...")
          found_urls = set()
          ignored_domains = [
              "android.com", "w3.org", "google.com", "googleapis.com", 
              "example.com", "adobe.com", "schema.org", "unity3d.com",
              "vungle.com", "bytedance.com", "dashif.org", "tizen.org"
          ]

          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  file_path = os.path.join(root, file)
                  try:
                      with open(file_path, "rb") as f:
                          content = f.read()
                          urls = re.findall(rb'https?://[^\s<>"]+|www\.[^\s<>"]+', content)
                          for u in urls:
                              url_str = u.decode('utf-8', errors='ignore')
                              if not any(domain in url_str for domain in ignored_domains):
                                  found_urls.add(url_str)
                  except Exception:
                      pass

          print("\n" + "="*50)
          print("🎯 TARGET API & LOGIN ENDPOINTS FOUND:")
          print("="*50)
          for u in sorted(found_urls):
              print(u)
          print("="*50)
        shell: python
