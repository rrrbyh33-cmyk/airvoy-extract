name: Extract Real App Endpoints Only

on:
  workflow_dispatch:

jobs:
  extract-real-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deep Scan Core App Files
        run: |
          python3 -c '
          import os, zipfile, re

          zip_files = [f for f in os.listdir(".") if f.endswith(".zip")]
          if zip_files:
              with zipfile.ZipFile(zip_files[0], "r") as zf:
                  zf.extractall("extracted_zip")

          for root, dirs, files in os.walk("extracted_zip"):
              for file in files:
                  if file.endswith(".apk"):
                      with zipfile.ZipFile(os.path.join(root, file), "r") as apk_z:
                          apk_z.extractall("unpacked_apk_sources")

          print("=== البحث عن الروابط في الكود الأساسي (استثناء الإعلانات) ===")
          for root, dirs, files in os.walk("unpacked_apk_sources"):
              # نتجاهل مجلدات الإعلانات كلياً
              if "ad-viewer" in root or "unity" in root:
                  continue
              for file in files:
                  if file.endswith((".js", ".json", ".dart", ".ts")):
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                              # البحث عن الروابط أو مسارات الباك إند
                              urls = re.findall(r"https?://[^\s\"<>]+|/[a-zA-Z0-9_/-]+(?:api|auth|login|v1|user)[^\s\"<>]*", content)
                              for u in set(urls):
                                  if "render.com" in u or "airvoy" in u or "api" in u:
                                      print(f"[هدف حقيقي]: {file_path} --> {u}")
                      except Exception:
                          pass
          '
