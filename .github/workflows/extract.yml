name: Extract Flutter API Routes
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          import zipfile, os, re

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip') and 'Airvoy' in f]
          if not zip_files: exit(1)
          
          extract_dir = "extracted_apk"
          os.makedirs(extract_dir, exist_ok=True)
          with zipfile.ZipFile(zip_files[0], 'r') as z:
              z.extractall(extract_dir)

          api_routes = set()

          for root, dirs, files in os.walk(extract_dir):
              for file in files:
                  try:
                      file_path = os.path.join(root, file)
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          # البحث عن أي مسارات برمجيّة أو نسبية للـ API مثل /api/... أو /v1/...
                          matches = re.findall(r'["\'](/[a-zA-Z0-9_\-/]+(?:api|v[0-9]|auth|login|signin|user|account)[a-zA-Z0-9_\-/]*)["\']', content, re.IGNORECASE)
                          for m in matches:
                              if len(m) > 4:
                                  api_routes.add(m)
                  except:
                      pass

          print("\n" + "="*60)
          print(f"🎯 FOUND API ROUTES ({len(api_routes)} found):")
          print("="*60)
          for r in sorted(api_routes):
              print(r)
          print("="*60)
        shell: python
